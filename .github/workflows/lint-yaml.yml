name: Lint YAML

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/**/*.yml"
      - "ops/**/*.yaml"
      - ".github/workflows/lint-yaml.yml"
  pull_request:
    paths:
      - ".github/**/*.yml"
      - "ops/**/*.yaml"
      - ".github/workflows/lint-yaml.yml"

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Parse GitHub and ops YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          roots = [Path('.github'), Path('ops')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.suffix in {'.yml', '.yaml'})
          if not files:
              raise SystemExit('no yaml files')
          for p in files:
              list(yaml.safe_load_all(p.read_text(encoding='utf-8')))
              print('ok', p)
          print('pass', len(files))
          PY
