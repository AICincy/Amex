name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
        default: v0.1.3.5
      title:
        description: Release title
        required: true
        default: 0.1.3.5 AutoMod

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file - \
            "automod/current/r-amex-automod-0.1.3.5.yaml" \
            "public/r-amex-rule-1-public-copy.md" <<'EOF'
          Staff paste pack for r/amex AutoMod 0.1.3.5.

          - AutoMod file: automod/current/r-amex-automod-0.1.3.5.yaml
          - Public Rule 1 / 1e / thread header: public/r-amex-rule-1-public-copy.md
          - 0.1.3.5 is a version stamp of 0.1.3.4. Last body change was 0.1.3.4.
          - A release does not paste the wiki. Human gates remain.

          Open human gates recorded in ops/amex-ops-state.public.yaml:
          - Rule 1 public copy paste
          - Crowd Control inspect
          EOF
