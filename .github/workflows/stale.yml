name: Mark stale issues and pull requests
on:
  schedule:
    - cron: '18 2 * * *'
jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'No activity on this issue. Comment to keep it open, or it will be closed.'
          stale-pr-message: 'No activity on this pull request. Comment to keep it open, or it will be closed.'
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
