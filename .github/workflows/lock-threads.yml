name: Lock closed threads
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: dessant/lock-threads@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: '30'
          pr-inactive-days: '30'
