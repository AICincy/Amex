name: Validate AutoMod YAML

on:
  workflow_dispatch:
  push:
    paths:
      - "automod/current/**"
      - ".github/workflows/validate-automod.yml"
  pull_request:
    paths:
      - "automod/current/**"
      - ".github/workflows/validate-automod.yml"

jobs:
  yaml-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check current AutoMod draft
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('automod/current').glob('*.yaml'))
          if not files:
              raise SystemExit('no current AutoMod files')
          for p in files:
              text = p.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  raise SystemExit(f'first line must be --- in {p}')
              if text.split('---', 1)[0].strip():
                  raise SystemExit(f'text before first --- in {p}')
              if '(?i)' in text or '(?-i)' in text:
                  raise SystemExit(f'illegal inline case flag in {p}')
              print('ok', p)
          print('pass', len(files))
          PY
